services:
  - type: web
    name: carloansaathi-api
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: NODE_ENV
        value: production
      - key: CLIENT_ORIGIN
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: FIREBASE_STORAGE_BUCKET
        sync: false
      - key: FIREBASE_WEB_API_KEY
        sync: false
      - key: FIREBASE_AUTH_REFERER
        value: https://www.carloansaathi.com
      - key: FIREBASE_ACTION_CONTINUE_URL
        sync: false
      - key: ENABLE_SUBSCRIPTION_BILLING
        sync: false
      - key: ENABLE_PAYMENT_RECONCILIATION
        value: "true"
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: PAYMENT_RECONCILIATION_INTERVAL_MS
        value: "900000"
      - key: SUPER_ADMIN_EMAIL
        sync: false
      - key: AUTH_RATE_LIMIT_MAX
        value: "10"
      - key: PASSWORD_RESET_RATE_LIMIT_MAX
        value: "5"
      - key: REGISTRATION_RATE_LIMIT_MAX
        value: "15"
      - key: PUBLIC_LEAD_RATE_LIMIT_MAX
        value: "8"
      - key: UPLOAD_RATE_LIMIT_MAX
        value: "30"
      - key: MAX_FAILED_LOGINS
        value: "5"
      - key: ACCOUNT_LOCK_MINUTES
        value: "30"
